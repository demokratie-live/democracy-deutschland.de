# Roadmap of /engineering/ (live: table `roadmap` in the SAI, sorted by
# `order`, and the texts with the tag "roadmap"). Taken from live on 2026-10-13.
#
# Column heads: `text`, the line below it (`date`) and its colour class
# rmicon-<color> (blue, grey, red, green, black).
columns:
  beta:
    text: "Master Beta"
    color: blue
    date: "30.4.19"
  mvp:
    text: "Public MVP"
    color: green
    date: "01.10.18"
  dream:
    text: "Post MVP"
    color: black
    # &nbsp; keeps the line as high as the others.
    date: "\u00A0"

# One row per goal, in this order. `sub: true` indents the goal (three
# &nbsp; on live), `bold: true` sets it in <b>, `issue` links a GitHub issue
# of democracy-client (#<issue>).
#
# beta, mvp, dream: status code of icon_class() (src/lib/roadmap.ts):
#   0 = empty; tens = icon: 0 check-square, 1 square, 2 pencil-square,
#   3 plus-square, 4 minus-square, 5 odnoklassniki-square, 6 github-square,
#   7 times-circle; ones = colour: 1 blue, 2 grey, 3 red, 4 and 5 green.
#   Live only uses 0, 1 (blue check) and 2 (grey check).
