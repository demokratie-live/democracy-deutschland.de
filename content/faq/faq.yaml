questions:
  - question: Gebt ihr meine Daten an Dritte weiter?
    categories: [datenschutz]
    answer: |
      Die Betreiber der App DEMOCRACY nehmen den Schutz Deiner persönlichen Daten sehr ernst.<br />
      Unserer Meinung nach sind Nutzerdaten gerade keine handelbaren Wirtschaftsgüter, sondern im Sinne des Grundgesetzes zu schützen. Deshalb behandeln wir Deine personenbezogenen wie Abstimmungs-Daten vertraulich entsprechend den gesetzlichen Datenschutzrichtlinien und geben sie selbstverständlich nicht an Dritte weiter.<br />
      Damit Du Dich bei der Nutzung unserer App sicher fühlst, informieren wir Dich [hier](/datenschutz/) zusätzlich zu den gesetzlichen Bestimmungen darüber, welche Daten wir warum erheben und wie wir diese verarbeiten und nutzen.<br />
      Unser Konzept zur Aufrechterhaltung des Abstimmungs- bzw. Wahlgeheimnis innerhalb der App DEMOCRACY kannst du hier nachlesen: <a href="https://github.com/demokratie-live/democracy-development/wiki/Stimmanonymit%C3%A4t" target="_blank">https://github.com/demokratie-live/democracy-development/wiki/Stimmanonymität</a>.

  - question: Wie stellt ihr meine Stimmanonymität sicher?
    categories: [datenschutz]
    answer: |
      Wahlgeheimnis bedeutet, dass während und nach einer Wahl keine Information bekannt werden darf, die darauf schließen lässt, was ein Wähler gewählt hat. Im Konkreten geht es also um die Trennung von Person und Stimme in Urnenbuch und Auszählung. Die Aufrechterhaltung dieses Abstimmungs- bzw. Wahlgeheimnis ist zentraler Bestandteil der DNA der DEMOCRACY App.<br />
      <br />
      Unser Konzept sieht dafür vor, jede Deiner Abstimmungsentscheidungen (Ja, Enthaltung, Nein als Stimme) von Deinen personenbezogenen Identifikationsdaten ( – dem Urnenbuch) zu trennen. Technisch lösen wir das ganze durch eine sogenannte serverseitige Profiling-Daten-Vermeidung. Praktisch wird dabei eine Quittung Deiner Abstimmungsentscheidung lediglich lokal auf Deinem Handy gespeichert, während Ihre Stimme serverseitig von Anfang an nur akkumuliert gespeichert wird.<br />
      <br />
      Deine Stimmnonymität stellen wir also sicher, indem
      <ul><li>wir Deine Stimme serverseitig nur akkumuliert speichern (für Dich besteht dennoch die Möglichkeit eine Quittung über Deine Stimme auf Deinem Handy unakkumuliert zu speichern)</li><li>wir keinen Servertraffic loggen</li><li>und wir kein Datum zu Deiner Stimmabgabe speichern.</li></ul>
      Dieses Verfahren führt, und das sei der Vollständigkeit halber gesagt, in Grenzfällen zu Deanonymisierung, nämlich wenn<br />
      <ul><li>nur Du abgestimmt hast</li><li>wenige Nutzer inklusive Dir abgestimmt haben und die Stimme der anderen bekannt ist, so dass Deine Stimme ermittelt werden kann</li><li>Der Netzwerkverkehr überwacht wird und das SSL Zertifikat gebrochen wird.</li></ul>
      Das vollständige Konzept zur Stimmanonymisierung kannst du hier <a href="https://github.com/demokratie-live/democracy-development/wiki/Stimmanonymit%C3%A4t" target="_blank">https://github.com/demokratie-live/democracy-development/wiki/Stimmanonymität</a> nachlesen.

  - question: Sensible Daten und Open Source – geht das?
    categories: [datenschutz]
    answer: |
      Open Source bedeutet, dass der Quellcode frei und offen ist. Die Daten der Nutzer sind kein Bestandteil des Quellcodes, sondern der entsprechenden Installation des freien Programms auf einem Server. Insofern ist der unberechtigte Zugriff auf Nutzerdaten durch Dritte durch unsere Open-Source-Eigenschaft nicht angetastet. Überdies wird jede Änderung im Code, bevor sie in den Betrieb übergeht, von uns geprüft. Somit wird der hohe Anspruch an guter Programmierung gewahrt und auch verhindert, dass dubioser Code einfließen kann.

  - question: Wie wird DEMOCRACY finanziert?
    categories: [finanzen]
    answer: |
      DEMOCRACY ist eine gemeinnützige App, das heißt von Menschen, für Menschen, um unsere Politik transparenter und bürgernaher zu machen. Da wir DEMOCRACY als eine werbefreie Plattform ohne Datenverkauf realisieren wollen, kann unser Joker nur die gemeinschaftliche Finanzierung sein. Insofern wird DEMOCRACY, um die laufenden Kosten zu decken, auch nach dem initialen Crowdfunding durch Spenden finanziert.

  - question: Warum braucht ihr Geld?
    categories: [finanzen]
    answer: |
      Während die Konzeption der Plattform bislang hauptsächlich von freiwilliger Arbeit gestemmt wurde, hat der Crowdfundingerfolg DEMOCRACY Deutschland e.V. das Privileg verschafft, 3 Vollzeitangestellte für 6 Monate beschäftigen zu können, die ihre gesamte Zeit und Energie dem Projekt widmen – das hat die Entwicklung von DEMOCRACY extrem vorangebracht.<br />
      <br />
      Wenn es nach uns geht, möchten wir so schnell wie möglich mit dem DEMOCRACY MVP an den Start gehen, allerdings müssen bis dahin noch einige Meilensteine in der Entwicklung erreicht werden. Und dafür brauchen wir Deine finanzielle Unterstützung, um das Nötige zum Leben zu erhalten.

