  - id: home
    label: "DEMOCRACY"
    href: "/"
  - id: about
    label: "Über Uns"
    href: "/ueber-uns/"
  - id: press
    label: "Presse"
    href: "/presse/"
  - id: donate
    label: "Spenden"
    href: "/spenden/"
    important: true
