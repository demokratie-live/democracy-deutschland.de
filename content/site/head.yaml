  description: "Mach Dich zum Abgeordneten! Ganz einfach: Mit DEMOCRACY. Kontrolliere das Stimmverhalten Deiner Politiker. Stimme zu den gleichen Themen selbst ab. Finde Übereinstimmungen & Abweichungen. Erhalte faktenbasierte Hilfe für Deine nächste Wahlentscheidung. Alles in einer kostenlosen und gemeinnützigen App."
