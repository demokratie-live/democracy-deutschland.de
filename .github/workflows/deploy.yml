name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Plesk serves the site (docs/hosting-plesk.md), GitHub Pages is no longer used
# (hosting outside the US). The basePath build stays as a CI check.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate content
        run: pnpm validate-content

      - name: Unit tests
        run: pnpm test:unit

      - name: Build (for tests, without basePath)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm exec playwright test

      # The export without basePath is what Plesk serves at the domain root;
      # on pull requests it is the preview, on main the job build-branch uses it.
      - name: Upload export (Plesk and preview)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: website-root-${{ github.run_id }}
          path: out
          include-hidden-files: true # out/.htaccess
          retention-days: 7

      - name: Add preview info to summary
        run: |
          {
            echo "### Preview"
            echo ""
            echo "- Artifact: \`website-root-${GITHUB_RUN_ID}\` (export without basePath, with \`.htaccess\`)"
            echo "- Download it from the workflow run and serve it with \`npx serve out\` (or \`pnpm serve-apache\` for the redirects)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Same command as locally: build under a basePath with the test endpoints
      # of the forms, then Playwright (playwright.basepath.config.ts).
      - name: Build and E2E tests with basePath
        run: pnpm test:basepath

  # Plesk-Git pulls the branch `deploy` and copies it into the document root
  # (docs/hosting-plesk.md). One commit per build; reset the branch to roll back.
  build-branch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v4.1.8
        with:
          name: website-root-${{ github.run_id }}
          path: site

      - name: Commit the export to the branch deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/publish-build-branch.sh site deploy origin
